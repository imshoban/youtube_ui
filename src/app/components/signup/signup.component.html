<div class="loading-screen" *ngIf="loading">
    <mat-spinner class="mat"></mat-spinner>
</div>
<div class="container">
    
    <div class="logo-container">
        <img src="assets/logo.webp" alt="" width="30%">
        <h1>Create your Account </h1>
        <h4>to continue to YouTube</h4>
    </div>
    <form [formGroup]="signupForm" (ngSubmit)="signUp()" >   
        <div class="profile-upload-container">
            <label for="file-input">
                <div class="small-profile">
                    <img class='profile-upload' src="assets/profile-pic-upload.jpg" alt="click here to upload photo" width="50px" #icon>
                    <img class='uploaded-img' #preview>
                    <p #preview_content>Upload Profile Picture</p>
                    <span *ngIf="formatError"> Unsupported Format</span>
                </div>
            </label>
            <input id="file-input" type="file" accept="image/*" (change)="onFileSelected($event)" style="display:none;"> 

        </div>      
        <div><span *ngIf="registered">Already Registered</span></div>
        <div><span *ngIf="error">Something Went Wrong</span></div>
        <div class="inner-element">
            <label for="username"></label>
            <input type="text" class="form-control" id="username" name="username" formControlName="username" placeholder="Username">
        </div>
        <div><span *ngIf="signupForm.get('username')?.errors?.required && signupForm.get('username')?.touched">  Username is required </span></div>
        <div class="inner-element">
            <label for="email"></label>
            <input type="email" class="form-control" id="email" name="email" formControlName="email" placeholder="Email">
        </div>
        <div>
            <span *ngIf="signupForm.get('email')?.errors?.required && signupForm.get('email')?.touched"> Email is required </span>
            <span *ngIf="signupForm.get('email')?.errors?.email && signupForm.get('email')?.touched"> Please enter a valid email </span>
        </div>
        <div class="form-group">
            <label for="password"></label>
            <input type="password" class="form-control" id="password" name="password" formControlName="password" placeholder="Password">
        </div>
        <div>
            <span *ngIf="signupForm.get('password')?.errors?.required && signupForm.get('password')?.touched">Password is required</span>
            <span *ngIf="signupForm.get('password')?.errors?.minlength && signupForm.get('password')?.touched">Password should be greater than 8 characters</span>
        </div>
        <div class="bottom-container">
            <a routerLink="/">Sign in instead</a>
            <button type="submit" class="signup-button">Sign Up</button>
        
        </div>
    </form>
    
  </div>
